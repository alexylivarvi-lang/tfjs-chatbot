<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TensorFlow.js Chatbot (N-gram)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <style>
    :root {
      --bg: #f3f6fb;
      --panel: #ffffff;
      --border: #dfe7f1;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --user-bg: #dbeafe;
      --user-text: #1e3a8a;
      --bot-bg: #dcfce7;
      --bot-text: #166534;
      --text: #1f2937;
      --muted: #6b7280;
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
      --avatar-bot: #22c55e;
      --avatar-user: #60a5fa;
    }

    * { box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      max-width: 580px;
      margin: 30px auto;
      padding: 0 14px;
      background: linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      color: var(--text);
    }

    .app {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.7rem;
      color: var(--primary-dark);
    }

    #status {
      min-height: 22px;
      margin-bottom: 12px;
      font-style: italic;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .suggestions-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .chip {
      background: #eff6ff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chip:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    #chat-box {
      height: 320px;
      border: 1px solid var(--border);
      background: #f9fbff;
      overflow-y: auto;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 12px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin: 10px 0;
    }
    .message-row.user { justify-content: flex-end; }
    .message-row.bot { justify-content: flex-start; }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      flex-shrink: 0;
    }
    .avatar.bot { background: var(--avatar-bot); }
    .avatar.user { background: var(--avatar-user); }

    .msg {
      max-width: 85%;
      padding: 10px 12px;
      border-radius: 12px;
      line-height: 1.45;
      word-wrap: break-word;
      font-size: 0.96rem;
    }
    .user .msg {
      background: var(--user-bg);
      color: var(--user-text);
      text-align: right;
      border-bottom-right-radius: 4px;
    }
    .bot .msg {
      background: var(--bot-bg);
      color: var(--bot-text);
      border-bottom-left-radius: 4px;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 10px 12px;
      width: fit-content;
      background: var(--bot-bg);
      color: var(--bot-text);
      border-radius: 12px;
      border-bottom-left-radius: 4px;
    }
    .typing .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--bot-text);
      opacity: 0.55;
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing .dot:nth-child(2) { animation-delay: 0.2s; }
    .typing .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .input-area { display: flex; gap: 8px; }
    input {
      flex: 1;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: white;
    }
    input:focus {
      outline: 2px solid rgba(37, 99, 235, 0.18);
      border-color: var(--primary);
    }
    button.send-btn {
      padding: 12px 18px;
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }
    button.send-btn:hover:not(:disabled) { transform: translateY(-1px); }
    button.send-btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body>

  <div class="app">
    <h2>TensorFlow.js Chatbot</h2>
    <div id="status">Alustetaan ja opetetaan mallia...</div>
    
    <div class="suggestions-label">Kokeile aiheita:</div>
    <div class="suggestions" id="suggestions">
      <button class="chip" onclick="sendQuickText('Mitä osaat')">💡 Mitä osaat</button>
      <button class="chip" onclick="sendQuickText('Mitä kuuluu')">👋 Mitä kuuluu</button>
      <button class="chip" onclick="sendQuickText('Mitä on koneoppiminen')">🤖 Koneoppiminen</button>
      <button class="chip" onclick="sendQuickText('Miten kasveja hoidetaan')">🌿 Kasvien hoito</button>
      <button class="chip" onclick="sendQuickText('Kerro fysiikasta')">⚛️ Fysiikka</button>
      <button class="chip" onclick="sendQuickText('Mitä pelejä suosittelet')">🎮 Pelit</button>
      <button class="chip" onclick="sendQuickText('Miten virheitä korjataan')">🛠️ Koodausapu</button>
    </div>

    <div id="chat-box"></div>
    
    <div class="input-area">
      <input type="text" id="userInput" placeholder="Odotetaan mallin alustusta..." disabled />
      <button id="sendBtn" class="send-btn" disabled>Lähetä</button>
    </div>
  </div>

  <script>
    const intents = [
      {
        tag: "tervehdys",
        patterns: ["hei", "moikka", "terve", "päivää", "moro", "moi", "hyvää päivää"],
        responses: [
          "Moi! Kuinka voin auttaa sinua tänään?",
          "Tervehdys! Mitä haluaisit kysyä?",
          "Hei siellä! Miten voin olla avuksi?"
        ]
      },
      {
        tag: "vointi",
        patterns: ["mitä kuuluu", "kuinka voit", "miten menee", "mitä äijä", "miten voit"],
        responses: [
          "Minulle kuuluu hyvää, olenhan koodia selaimessasi!",
          "Kaikki bitti kohdallaan, kiitos kysymästä!",
          "Olen hyvällä mielellä ja valmiina keskustelemaan."
        ]
      },
      {
        tag: "osaaminen",
        patterns: [
          "mitä osaat", "mitä osaat tehdä", "mitä teet", "mitkä ovat ominaisuutesi", 
          "mitä voin kysyä", "mitä kaikkea osaat", "minkälaisia asioita osaat",
          "esittele itsesi", "kerro itsestäsi", "kuka olet"
        ],
        responses: [
          "Osaan vastata kysymyksiin koneoppimisesta, kasvien hoidosta, fysiikasta, peleistä ja koodauksesta!",
          "Olen TensorFlow.js-pohjainen chatbot. Voit kysyä minulta esimerkiksi koodauksesta, kasvien hoidosta tai fysiikasta.",
          "Voin keskustella eri aiheista, kuten koneoppimisesta, pelikehityksestä tai kasvien hoidosta."
        ]
      },
      {
        tag: "näkemiin",
        patterns: ["hei hei", "heippa", "näkemisiin", "moro taas", "moi moi", "näkemiin"],
        responses: ["Näkemiin!", "Mukavaa päivänjatkoa!", "Moi moi! Palaillaan taas!"]
      },
      {
        tag: "apua",
        patterns: ["apua", "auta", "ohjeita", "miten tämä toimii", "mikä sinä olet"],
        responses: [
          "Voit kysyä minulta esimerkiksi koodauksesta, fysiikasta, kasveista tai peleistä!",
          "Minä olen TensorFlow.js-pohjainen chatbot, joka oppii tunnistamaan aiheita syötteestäsi.",
          "Napsauta yläpuolella olevia ehdotusnappeja tai kirjoita oma kysymyksesi."
        ]
      },
      {
        tag: "tekniikka",
        patterns: [
          "mitä on tensorflow", "mitä on javascript", "mitä on koneoppiminen", 
          "mitä on ai", "mikä on python", "koneoppiminen", "kerro koneoppimisesta"
        ],
        responses: [
          "TensorFlow on Googlen kehittämä kirjasto koneoppimismallien rakentamiseen.",
          "JavaScript on verkkosivujen ja selain sovellusten tärkein ohjelmointikieli.",
          "Koneoppiminen tarkoittaa mallia, joka oppii löytämään säännönmukaisuuksia datasta."
        ]
      },
      {
        tag: "kasvit",
        patterns: [
          "kasvit", "kasvien hoito", "miten kasveja hoidetaan", "kastelu", 
          "lannoitus", "botaniikka", "kasvi", "hoito", "huonekasvit"
        ],
        responses: [
          "Tärkeintä kasvien hoidossa on oikea valon määrä ja säännöllinen kastelu. Varo kastelemasta liikaa!",
          "Tarkista aina mullan kosteus sormella ennen kastelua. Monet kasvit pitävät myös sumuttelusta.",
          "Kasvit tarvitsevat valoa yhteyttämiseen, vettä ravinteiden kuljetukseen ja sopivasti lannoitetta kasvukaudella."
        ]
      },
      {
        tag: "fysiikka_matematiikka",
        patterns: [
          "fysiikka", "matematiikka", "suhteellisuusteoria", "kvanttimekaniikka", 
          "laskeminen", "yhtälö", "kerro fysiikasta"
        ],
        responses: [
          "Fysiikka auttaa ymmärtämään maailmankaikkeuden toimintaa aina kvanttitasolta suuriin tähtijärjestelmiin!",
          "Matematiikka on fysiikan ja ohjelmoinnin kieli. Pienetkin yhtälöt voivat kuvata monimutkaisia ilmiöitä.",
          "Tiesitkö, että koneoppiminen nojaa vahvasti matriisilaskentaan ja derivaattoihin?"
        ]
      },
      {
        tag: "pelit",
        patterns: [
          "pelit", "pelaaminen", "roblox", "mitä pelejä", "peli suositus", 
          "pelaatko", "mitä pelejä suosittelet"
        ],
        responses: [
          "Pelaaminen on loistavaa viihdettä! Luovat alustat kuten Roblox tarjoavat myös hyvän tavan oppia pelikehitystä.",
          "Pelit yhdistävät grafiikkaa, fysiikkamoottoreita ja koodia – ne ovat loistava paikka oppia ohjelmointia!",
          "Mikä on sinun lempipelisi juuri nyt?"
        ]
      },
      {
        tag: "virhe_apu",
        patterns: [
          "virhe", "bugit", "ongelma", "ei toimi", "broken", 
          "error", "miten korjaan", "miten virheitä korjataan"
        ],
        responses: [
          "Virheet ovat normaali osa kehitystä! Lue virheilmoitus tarkasti – se kertoo usein ratkaisun.",
          "Hyvä tapa korjata koodia: 1) Lue virhe 2) Tulosta muuttujien arvot (console.log) 3) Testaa osa kerrallaan."
        ]
      }
    ];

    const confidenceThreshold = 0.25;
    let vocabulary = [];
    let model;

    function stem(word) {
      if (word.length <= 3) return word;

      // Estetään avainverbien ja tiettyjen sanojen rikkoutuminen
      if (["osaat", "teet", "näet", "haet", "olet"].includes(word)) return word;

      return word
        .replace(/(ssa|ssä|sta|stä|hyn|hän|iin|lle|lla|llä|lta|ltä|ksi|kse|tta|ttä)$/gi, '')
        .replace(/(en|in|den|tten|ten|jens|vt|et)$/gi, '');
    }

    function tokenize(text) {
      const words = text
        .toLowerCase()
        .replace(/[^a-zäöå0-9\s]/gi, '')
        .split(/\s+/)
        .filter(x => x.length > 0)
        .map(word => stem(word));

      const tokens = [...words];

      // Muodostetaan bigrammit
      for (let i = 0; i < words.length - 1; i++) {
        tokens.push(`${words[i]}_${words[i + 1]}`);
      }

      return tokens;
    }

    function prepareData() {
      const wordsSet = new Set();
      intents.forEach(intent => {
        intent.patterns.forEach(pattern => {
          tokenize(pattern).forEach(token => wordsSet.add(token));
        });
      });
      vocabulary = Array.from(wordsSet);

      const inputs = [];
      const labels = [];

      intents.forEach((intent, intentIdx) => {
        intent.patterns.forEach(pattern => {
          const patternTokens = tokenize(pattern);
          const bow = vocabulary.map(token => patternTokens.includes(token) ? 1 : 0);
          inputs.push(bow);

          const label = new Array(intents.length).fill(0);
          label[intentIdx] = 1;
          labels.push(label);
        });
      });

      return {
        xs: tf.tensor2d(inputs),
        ys: tf.tensor2d(labels)
      };
    }

    async function trainModel() {
      try {
        const { xs, ys } = prepareData();

        model = tf.sequential();
        model.add(tf.layers.dense({ units: 32, inputShape: [vocabulary.length], activation: 'relu' }));
        model.add(tf.layers.dense({ units: intents.length, activation: 'softmax' }));

        model.compile({
          optimizer: 'adam',
          loss: 'categoricalCrossentropy',
          metrics: ['accuracy']
        });

        await model.fit(xs, ys, { epochs: 150, shuffle: true, verbose: 0 });

        xs.dispose();
        ys.dispose();

        document.getElementById('status').innerText = 'Malli valmis! Valitse aihe tai kirjoita viesti.';
        
        document.getElementById('userInput').disabled = false;
        document.getElementById('userInput').placeholder = 'Kirjoita viesti...';
        document.getElementById('sendBtn').disabled = false;

      } catch (error) {
        console.error(error);
        document.getElementById('status').innerText = 'Virhe mallin koulutuksessa.';
      }
    }

    function showTypingIndicator() {
      const chatBox = document.getElementById('chat-box');
      const typing = document.createElement('div');
      typing.className = 'message-row bot';
      typing.id = 'typing-indicator';
      typing.innerHTML = '<span class="avatar bot">B</span><div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
      chatBox.appendChild(typing);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function hideTypingIndicator() {
      const typing = document.getElementById('typing-indicator');
      if (typing) typing.remove();
    }

    function appendMessage(sender, text, className) {
      const chatBox = document.getElementById('chat-box');
      const row = document.createElement('div');
      row.className = `message-row ${className}`;

      const avatar = document.createElement('span');
      avatar.className = `avatar ${className}`;
      avatar.innerText = className === 'bot' ? 'B' : 'S';

      const msgDiv = document.createElement('div');
      msgDiv.className = 'msg';
      msgDiv.innerText = text;

      if (className === 'bot') {
        row.appendChild(avatar);
        row.appendChild(msgDiv);
      } else {
        row.appendChild(msgDiv);
        row.appendChild(avatar);
      }

      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage(textToSend) {
      const inputEl = document.getElementById('userInput');
      const text = textToSend || inputEl.value.trim();
      if (!text || !model) return;

      appendMessage('Sinä', text, 'user');
      if (!textToSend) inputEl.value = '';

      const tokens = tokenize(text);
      const bow = vocabulary.map(token => tokens.includes(token) ? 1 : 0);
      
      const inputTensor = tf.tensor2d([bow]);
      const prediction = model.predict(inputTensor);
      const probabilities = await prediction.data();
      
      const predictedIndex = probabilities.indexOf(Math.max(...probabilities));
      const confidence = probabilities[predictedIndex];
      
      inputTensor.dispose();
      prediction.dispose();

      showTypingIndicator();

      setTimeout(() => {
        hideTypingIndicator();
        if (confidence < confidenceThreshold) {
          appendMessage('Bot', 'En ihan varmasti ymmärtänyt. Kokeile valita aihe yllä olevista napeista!', 'bot');
        } else {
          const responseIntent = intents[predictedIndex];
          const chosenReply = responseIntent.responses[Math.floor(Math.random() * responseIntent.responses.length)];
          appendMessage('Bot', chosenReply, 'bot');
        }
      }, 400);
    }

    function sendQuickText(text) {
      const inputEl = document.getElementById('userInput');
      if (!inputEl.disabled) {
        sendMessage(text);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const sendBtn = document.getElementById('sendBtn');
      const userInput = document.getElementById('userInput');

      sendBtn.addEventListener('click', () => sendMessage());
      userInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') sendMessage();
      });

      trainModel();
    });
  </script>
</body>
</html>
